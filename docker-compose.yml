# ====================================================
# SysLab 2.0 - Orquestacion multi-contenedor
# Servicios: db (PostgreSQL) + backend + frontend
# ====================================================

services:
  # ---------------- Base de datos ----------------
  db:
    image: postgres:16-alpine
    container_name: syslab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syslab_net

  # ------------------- Backend -------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syslab_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syslab_net

  # ------------------ Frontend -------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syslab_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - syslab_net

volumes:
  postgres_data:
    driver: local

networks:
  syslab_net:
    driver: bridge
