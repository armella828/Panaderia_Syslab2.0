# ====================================================
# Panaderia_Syslab2.0 - Orquestacion de PRODUCCION
# Servicios: db (PostgreSQL) + backend + frontend (nginx)
# Uso en Ubuntu/Docker: docker compose up -d --build
# ====================================================

services:
  # ---------------- Base de datos ----------------
  db:
    image: postgres:16-alpine
    container_name: panaderia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - panaderia_net

  # ------------------- Backend -------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: panaderia_backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - panaderia_net

  # ------------------ Frontend -------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: panaderia_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - panaderia_net

volumes:
  postgres_data:
    driver: local

networks:
  panaderia_net:
    driver: bridge